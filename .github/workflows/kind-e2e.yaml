name: e2e

on:
  pull_request:
    branches: [ 'main' ]

jobs:
  kind:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Keep running if one leg fails.
      matrix:
        k8s-version:
        - v1.35.x
        - v1.36.x
        ingress:
        - istio
        - contour
        - envoy-gateway

    env:
      KO_DOCKER_REPO: kind.local
      # Use a semi-random cluster suffix, but somewhat predictable
      # so reruns don't just give us a completely new value.
      CLUSTER_SUFFIX: c${{ github.run_id }}.local

    steps:

    - uses: knative/actions/setup-go@main
    - uses: ko-build/setup-ko@v0.10

    - uses: chainguard-dev/actions/setup-kind@8f31e9482b447ff2c69eca944a09b4b31a4a85d0 # v1.7.2
      with:
        k8s-version: ${{ matrix.k8s-version }}
        kind-worker-count: 3

    - uses: actions/checkout@v7

    # Helm 4's server-side apply conflicts with the preinstalled Gateway API CRDs.
    - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      with:
        version: v3.22.0

    - name: test
      run: |
        ./test/e2e-tests.sh \
          --${{ matrix.ingress }} \
          --run-tests \
          --kind \
          --skip-dump-on-failure

    - uses: chainguard-dev/actions/kind-diag@794a2c44abbbd7b3a186db97b359270e4105448f # v1.8.0
      if: ${{ failure() }}
      with:
        cluster-resources: nodes,namespaces,crds,gatewayclass
        namespace-resources: pods,svc,king,gateway,httproute,referencegrant,tcproute,tlsroute,udproute
        artifact-name: logs-${{ matrix.k8s-version}}-${{ matrix.ingress }}
